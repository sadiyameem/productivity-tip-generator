<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Productivity Generator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>Productivity Tip Generator</h1>
            <div class="tip-container" id="tipContainer">
                <div class="tip-text" id="tipText">
                    Click the button to get a productive tip
                </div>
            </div>
            <button class="generate-btn" onclick="generateTip()">Get Tip</button>
            <div class="tip-counter" id="tipCounter">Tips: 0</div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
